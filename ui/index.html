<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地数据留存</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; --line: color-mix(in srgb, CanvasText 18%, Canvas); --muted: color-mix(in srgb, CanvasText 70%, Canvas); --accent: light-dark(#245bc1, #95baff); }
    * { box-sizing: border-box; }
    main { max-width: 1000px; margin: auto; }
    header { margin-bottom: 24px; }
    .panel { padding: 16px; border: 1px solid var(--line); border-radius: 10px; }
    legend { padding: 0 6px; font-weight: 600; }
    input:not([type="checkbox"]) { min-width: 0; width: 100%; min-height: 38px; padding: 8px 10px; color: CanvasText; background: Canvas; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    button.primary { color: light-dark(white, #102445); background: var(--accent); border-color: var(--accent); font-weight: 600; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .row { flex-wrap: wrap; align-items: center; }
    .toolbar { margin: 10px 0; }
    .toolbar button { min-height: 32px; padding: 4px 8px; font-size: 12px; }
    .choices { height: 240px; overflow: auto; margin: 8px 0; }
    .choices label { display: flex; gap: 10px; align-items: center; padding: 9px 6px; border-radius: 5px; overflow-wrap: anywhere; cursor: pointer; }
    .choices label:hover { background: color-mix(in srgb, CanvasText 5%, Canvas); }
    .choices label:has(input:checked) { background: color-mix(in srgb, var(--accent) 9%, Canvas); }
    .choices input { flex: none; }
    .hint, .status, .record-meta { color: var(--muted); }
    .summary { margin: 12px 0; padding: 12px 14px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 7%, Canvas); }
    .summary strong { font-weight: 600; }
    .summary p { margin: 3px 0 0; }
    .save-row { margin-top: 18px; }
    .save-row .status { margin: 0; flex: 1; }
    .records li { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 18px 0; border-block: 1px solid var(--line); }
    .metric { min-width: 0; padding: 12px; }
    .metric + .metric { border-left: 1px solid var(--line); }
    .metric-label { display: block; color: var(--muted); font-size: 12px; }
    .metric-value { display: block; margin-top: 3px; font-size: 20px; font-weight: 650; overflow-wrap: anywhere; }
    .chart-title { display: block; margin: 18px 0 8px; font-size: 13px; font-weight: 600; }
    .size-chart { display: grid; gap: 8px; }
    .size-row { display: grid; grid-template-columns: 94px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 12px; }
    .size-track { height: 10px; overflow: hidden; border-radius: 2px; background: color-mix(in srgb, CanvasText 8%, Canvas); }
    .size-bar { display: block; height: 100%; background: #087e8b; }
    .size-count { text-align: right; font-variant-numeric: tabular-nums; }
    .archive-path { display: grid; gap: 3px; margin: 12px 0; }
    .archive-path code { overflow-wrap: anywhere; user-select: all; }
    input[type="search"] { margin: 8px 0; }
    @media (max-width: 640px) { .metric { padding: 10px 8px; } .metric-value { font-size: 17px; } .records li { align-items: flex-start; } }
    fieldset { min-width: 0; margin: 0; }
    #config-settings { padding: 0; border: 0; }
    details { margin-top: 16px; }
    summary { cursor: pointer; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .choices { height: auto; max-height: 220px; } }
    body { margin: 0; padding: 24px; color: CanvasText; background: Canvas; }
    h1 { margin: 0; font-size: 22px; font-weight: 650; }
    h2 { margin: 0; font-size: 16px; }
    p { margin: 8px 0 12px; }
    section { margin-top: 24px; }
    label { display: block; }
    input[type="checkbox"] { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); }
    button { flex: none; min-height: 36px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; color: CanvasText; background: color-mix(in srgb, CanvasText 5%, Canvas); font: inherit; cursor: pointer; }
    button:hover:not(:disabled) { background: color-mix(in srgb, CanvasText 10%, Canvas); }
    button:disabled { opacity: .5; cursor: default; }
    button.primary:hover:not(:disabled) { filter: brightness(.95); background: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; width: auto; }
    .between { justify-content: space-between; }
    .choices label { margin: 0; }
    .status { min-height: 21px; margin: 8px 0 0; overflow-wrap: anywhere; }
    .status[data-error="true"] { color: light-dark(#b42318, #ffb4ab); }
    .count { font-size: 12px; color: var(--muted); }
    .record-name { min-width: 0; overflow-wrap: anywhere; }
    .record-meta { display: block; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>本地数据留存</h1>
      <p class="hint">按分组和请求模型逐次保存上游请求与响应。正文保留业务内容，API key 经遮盖后归档。</p>
    </header>
    <fieldset id="config-settings" aria-labelledby="settings-title" disabled>
        <legend id="settings-title">保存范围</legend>
        <p class="summary" role="status"><strong id="selection-summary">加载筛选条件…</strong><span id="selection-detail"></span></p>
        <div class="grid">
          <fieldset class="panel">
            <legend>采集分组</legend>
            <span class="count" id="group-count"></span>
            <div class="toolbar"><button type="button" id="groups-all">全选</button> <button type="button" id="groups-none">清空</button></div>
            <div class="choices" id="groups"></div>
          </fieldset>
          <fieldset class="panel">
            <legend>采集模型</legend>
            <span class="count" id="model-count"></span>
            <div class="toolbar"><button type="button" id="models-all">全选</button> <button type="button" id="models-none">清空</button></div>
            <div class="choices" id="models"></div>
            <details>
              <summary>找不到模型？手动添加</summary>
              <div class="row"><input id="model-entry" aria-label="精确请求模型名" autocomplete="off" placeholder="添加精确请求模型名"><button type="button" id="add-model">添加并勾选</button></div>
            </details>
          </fieldset>
        </div>
        <details class="panel">
          <summary>存储选项</summary>
          <div class="row"><label for="directory">自定义 JSON 目录</label><input id="directory" autocomplete="off" placeholder="使用服务器持久化目录"></div>
          <div class="grid"><label for="bucket">S3 bucket（可选）<input id="bucket" autocomplete="off"></label><label for="region">AWS 区域<input id="region" autocomplete="off" placeholder="例如 ap-east-1"></label></div>
        </details>
        <div class="row save-row"><button class="primary" id="save" type="button" disabled>保存筛选条件</button><span class="status" id="config-status" role="status"></span></div>
    </fieldset>
    <section class="panel" aria-labelledby="records-title">
      <div class="row between"><h2 id="records-title">历史归档</h2><div class="row"><label for="date">日期（UTC）</label><input id="date" type="date"><button id="load" type="button">刷新记录</button></div></div>
      <p class="archive-path"><span class="hint">JSON 保存目录</span><code id="archive-location">正在读取…</code></p>
      <div class="metrics" aria-label="当日归档统计">
        <div class="metric"><span class="metric-label">当天归档记录数</span><strong id="metric-records" class="metric-value">—</strong></div>
        <div class="metric"><span class="metric-label">当天 JSON 文件总大小</span><strong id="metric-bytes" class="metric-value">—</strong></div>
        <div class="metric"><span class="metric-label">每条 JSON 平均大小</span><strong id="metric-average" class="metric-value">—</strong></div>
      </div>
      <h3 class="chart-title">单条档案体积分布</h3>
      <div id="size-chart" class="size-chart" role="img" aria-label="当天单条档案体积分布"></div>
      <label for="record-search" class="chart-title">筛选当天记录</label>
      <input id="record-search" type="search" placeholder="搜索记录 ID 或实例名">
      <p id="list-status" class="status" role="status"></p>
      <ul id="records" class="records"></ul>
    </section>
  </main>
  <script>
    (() => {
      const token = new URLSearchParams(location.hash.slice(1)).get('bridge_token');
      const pending = new Map();
      let nextID = 0;
      const send = (type, values = {}) => new Promise((resolve, reject) => {
        const request_id = `archive-${++nextID}`;
        const timer = setTimeout(() => { pending.delete(request_id); reject(new Error('宿主响应超时')); }, 15000);
        pending.set(request_id, { resolve, reject, timer });
        parent.postMessage({ source: 'sub2api-plugin-ui', bridge_token: token, type, request_id, ...values }, '*');
      });
      const recordSearch = document.querySelector('#record-search');
      const metricRecords = document.querySelector('#metric-records');
      const metricBytes = document.querySelector('#metric-bytes');
      const metricAverage = document.querySelector('#metric-average');
      const sizeChart = document.querySelector('#size-chart');
      let listedRecords = [];
      const renderRecords = () => {
        const query = recordSearch.value.trim().toLowerCase();
        records.replaceChildren();
        for (const record of listedRecords) {
          if (query && !`${record.record_id} ${record.instance_id}`.toLowerCase().includes(query)) continue;
          const item = document.createElement('li');
          const name = document.createElement('span');
          name.className = 'record-name';
          name.textContent = record.record_id;
          const meta = document.createElement('span');
          meta.className = 'record-meta';
          meta.textContent = `${record.date || date.value} · ${formatBytes(record.size)} · 实例 ${record.instance_id}`;
          const path = document.createElement('code');
          path.className = 'record-meta';
          path.textContent = `${(record.date || date.value).replaceAll('-', '/')}/${record.instance_id}/${record.record_id}.json`;
          name.append(meta, path);
          item.append(name);
          records.append(item);
        }
      };
      const bucket = document.querySelector('#bucket');
      const region = document.querySelector('#region');
      const groups = document.querySelector('#groups');
      const models = document.querySelector('#models');
      const modelEntry = document.querySelector('#model-entry');
      const addModel = document.querySelector('#add-model');
      const selected = container => [...container.querySelectorAll('input:checked')].map(input => input.value);
      const selectedGroups = () => selected(groups).map(Number);
      const configSettings = document.querySelector('#config-settings');
      const groupCount = document.querySelector('#group-count');
      const modelCount = document.querySelector('#model-count');
      const selectionSummary = document.querySelector('#selection-summary');
      const selectionDetail = document.querySelector('#selection-detail');
      const fill = (container, items, value, label, chosen = new Set()) => {
        container.replaceChildren(...items.map(item => {
          const row = document.createElement('label');
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.value = value(item);
          checkbox.checked = chosen.has(checkbox.value);
          const text = document.createElement('span');
          text.textContent = label(item);
          row.append(checkbox, text);
          return row;
        }));
      };
      const updateSelection = () => {
        const groupIDs = selectedGroups();
        const modelNames = selected(models);
        groupCount.textContent = `${groupIDs.length} 已选`;
        modelCount.textContent = `${modelNames.length} 已选`;
        selectionSummary.textContent = groupIDs.length && modelNames.length ? `采集 ${groupIDs.length} 个分组` : '分组或模型为空时暂停采集';
        selectionDetail.textContent = groupIDs.length && modelNames.length ? ` · ${modelNames.length} 个模型` : '';
      };
      const save = document.querySelector('#save');
      let modelLoadID = 0;
      let loadingModels = false;
      let saving = false;
      const updateSave = () => { save.disabled = configSettings.disabled || loadingModels || saving; };
      const loadModels = async groupIDs => {
        const loadID = ++modelLoadID;
        loadingModels = true;
        updateSave();
        try {
          const results = await Promise.all(groupIDs.map(groupID => send('archive.models', { group_id: groupID })));
          if (loadID !== modelLoadID) return;
          const chosen = new Set(selected(models));
          const choices = [...new Set([...results.flatMap(result => result.models || []), ...chosen])].sort();
          fill(models, choices, model => model, model => model, chosen);
        } finally {
          if (loadID === modelLoadID) {
            loadingModels = false;
            updateSelection();
            updateSave();
          }
        }
      };
      groups.addEventListener('change', async () => {
        updateSelection();
        try { await loadModels(selectedGroups()); }
        catch (error) { configStatus.textContent = error.message; }
      });
      models.addEventListener('change', () => { updateSelection(); updateSave(); });
      document.querySelector('#groups-all').addEventListener('click', () => {
        groups.querySelectorAll('input').forEach(input => { input.checked = true; });
        groups.dispatchEvent(new Event('change'));
      });
      document.querySelector('#groups-none').addEventListener('click', () => {
        groups.querySelectorAll('input').forEach(input => { input.checked = false; });
        groups.dispatchEvent(new Event('change'));
      });
      document.querySelector('#models-all').addEventListener('click', () => {
        models.querySelectorAll('input').forEach(input => { input.checked = true; });
        updateSelection();
        updateSave();
      });
      document.querySelector('#models-none').addEventListener('click', () => {
        models.querySelectorAll('input').forEach(input => { input.checked = false; });
        updateSelection();
        updateSave();
      });
      addModel.addEventListener('click', () => {
        const model = modelEntry.value.trim();
        const existing = [...models.querySelectorAll('input')].map(input => input.value);
        if (!model || existing.includes(model)) return;
        const values = [...selected(models), model];
        const choices = [...new Set([...existing, model])].sort();
        fill(models, choices, item => item, item => item, new Set(values));
        modelEntry.value = '';
        updateSelection();
        updateSave();
      });
      const configStatus = document.querySelector('#config-status');
      const listStatus = document.querySelector('#list-status');
      const records = document.querySelector('#records');
      const date = document.querySelector('#date');
      const today = new Date();
      date.value = today.toISOString().slice(0, 10);
      addEventListener('message', event => {
        if (event.source !== parent) return;
        const data = event.data;
        if (!data || data.source !== 'sub2api-plugin-host' || data.bridge_token !== token) return;
        const request = pending.get(data.request_id);
        if (!request) return;
        clearTimeout(request.timer);
        pending.delete(data.request_id);
        if (data.ok) request.resolve(data); else request.reject(new Error(data.error || '操作失败'));
      });
      const showArchiveLocation = root => {
        document.querySelector('#archive-location').textContent = `JSON 归档根目录：${(root || '宿主持久化目录下的 archive').replace(/\/+$/, '')}/rawdata-v2。下方显示相对路径。`;
      };
      save.addEventListener('click', async () => {
        saving = true;
        updateSave();
        configStatus.textContent = '正在保存…';
        const config = {
          directory: directory.value.trim(), bucket: bucket.value.trim(), region: region.value.trim(),
          group_ids: selectedGroups(), models: selected(models),
        };
        try {
          await send('config.save', { config });
          showArchiveLocation(config.directory);
          loadRecords();
          configStatus.textContent = '已保存';
        } catch (error) { configStatus.textContent = error.message; }
        finally { saving = false; updateSave(); }
      });
      const formatBytes = bytes => {
        const unit = bytes >= 1e12 ? 2 : bytes >= 1e9 ? 1 : 0;
        if (bytes > 0 && bytes < 100) return '< 0.0001 MB';
        const size = (bytes / 1000 ** (unit + 2)).toLocaleString('zh-CN', { maximumFractionDigits: 4 });
        return `${size} ${['MB', 'GB', 'TB'][unit]}`;
      };
      let listVersion = 0;
      const loadRecords = async () => {
        const version = ++listVersion;
        const day = date.value;
        records.replaceChildren();
        listedRecords = [];
        sizeChart.replaceChildren();
        metricRecords.textContent = metricBytes.textContent = metricAverage.textContent = '—';
        listStatus.textContent = day ? '正在读取…' : '请选择日期';
        if (!day) return;
        try {
          const result = await send('archive.list', { date: day });
          if (version !== listVersion) return;
          listedRecords = result.records || [];
          const totalBytes = listedRecords.reduce((total, record) => total + record.size, 0);
          metricRecords.textContent = listedRecords.length.toLocaleString('zh-CN');
          metricBytes.textContent = formatBytes(totalBytes);
          metricAverage.textContent = formatBytes(listedRecords.length ? Math.round(totalBytes / listedRecords.length) : 0);
          const bins = [0, 0, 0, 0];
          for (const record of listedRecords) bins[record.size < 1000 ? 0 : record.size < 10000 ? 1 : record.size < 100000 ? 2 : 3]++;
          const maxCount = Math.max(1, ...bins);
          const labels = ['< 0.001 MB', '0.001–0.01 MB', '0.01–0.1 MB', '≥ 0.1 MB'];
          sizeChart.replaceChildren(...bins.map((amount, index) => {
            const row = document.createElement('div');
            row.className = 'size-row';
            const label = document.createElement('span');
            label.textContent = labels[index];
            const track = document.createElement('span');
            track.className = 'size-track';
            const bar = document.createElement('span');
            bar.className = 'size-bar';
            bar.style.width = `${amount / maxCount * 100}%`;
            track.append(bar);
            const count = document.createElement('span');
            count.className = 'size-count';
            count.textContent = String(amount);
            row.append(label, track, count);
            return row;
          }));
          listStatus.textContent = listedRecords.length ? `${day} · ${listedRecords.length} 条记录 · 共 ${formatBytes(totalBytes)}` : `${day} 没有归档记录`;
          renderRecords();
        } catch (error) {
          if (version === listVersion) listStatus.textContent = error.message;
        }
      };
      document.querySelector('#load').addEventListener('click', loadRecords);
      date.addEventListener('change', loadRecords);
      recordSearch.addEventListener('input', renderRecords);
		const loadConfig = async () => {
			const result = await send('config.load');
			const config = result.config || {};
			directory.value = config.directory || '';
        showArchiveLocation(config.directory);
        loadRecords();
        bucket.value = config.bucket || '';
        region.value = config.region || '';
        const savedGroupIDs = (config.group_ids || []).map(Number);
        const groupResult = await send('archive.groups');
        const availableGroups = groupResult.groups || [];
        const knownGroupIDs = new Set(availableGroups.map(group => Number(group.id)));
        for (const groupID of savedGroupIDs) {
          if (!knownGroupIDs.has(groupID)) availableGroups.push({ id: groupID, name: `Unavailable group ${groupID}` });
        }
        fill(groups, availableGroups, group => String(group.id), group => group.name, new Set(savedGroupIDs.map(String)));
        const savedModels = config.models || [];
        fill(models, savedModels, model => model, model => model, new Set(savedModels));
        await loadModels(savedGroupIDs).catch(error => { configStatus.textContent = error.message; });
        configSettings.disabled = false;
        updateSave();
        updateSelection();
      };
      loadConfig().catch(error => { configStatus.textContent = error.message; save.disabled = true; });
      parent.postMessage({ source: 'sub2api-plugin-ui', bridge_token: token, type: 'sub2api.plugin.ready' }, '*');
    })();
  </script>
</body>
</html>
